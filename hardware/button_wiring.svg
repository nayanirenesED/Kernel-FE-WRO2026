<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: Arial, sans-serif;">

  <!-- TITLE -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C2C2A">Button wiring — KERNEL robot</text>

  <!-- DIVIDER -->
  <line x1="340" y1="40" x2="340" y2="530" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="340" y="536" text-anchor="middle" font-size="10" fill="#888780">Team KERNEL — WRO Future Engineers 2026</text>

  <!-- ═══════════════════════════════════ -->
  <!-- LEFT: GREEN BUTTON (GPIO) -->
  <!-- ═══════════════════════════════════ -->

  <text x="165" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#27500A">Green button — Run</text>
  <text x="165" y="70" text-anchor="middle" font-size="12" fill="#3B6D11">Tactile 12×12mm — GPIO signal</text>

  <!-- Raspberry Pi -->
  <rect x="20" y="90" width="120" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="80" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">Raspberry</text>
  <text x="80" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">Pi 4B</text>
  <text x="80" y="150" text-anchor="middle" font-size="11" fill="#0F6E56">GPIO header</text>

  <!-- Pin labels ABOVE the wires -->
  <text x="155" y="102" font-size="11" font-weight="bold" fill="#854F0B">Pin 11 — GPIO 17</text>
  <text x="155" y="148" font-size="11" font-weight="bold" fill="#444441">Pin 9  — GND</text>

  <!-- GPIO pin markers -->
  <rect x="140" y="108" width="12" height="8" rx="2" fill="#EF9F27" stroke="#BA7517" stroke-width="0.8"/>
  <rect x="140" y="152" width="12" height="8" rx="2" fill="#666" stroke="#333" stroke-width="0.8"/>

  <!-- Orange wire: GPIO 17 → button pin 1 (TOP wire) -->
  <path d="M152 112 L230 112" fill="none" stroke="#EF9F27" stroke-width="3" stroke-linecap="round"/>

  <!-- Black wire: GND → button pin 2 diagonal (BOTTOM wire) -->
  <path d="M152 156 L230 156" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>

  <!-- Green button -->
  <rect x="230" y="88" width="86" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="273" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#27500A">GREEN</text>
  <text x="273" y="138" text-anchor="middle" font-size="12" fill="#3B6D11">BUTTON</text>
  <text x="273" y="154" text-anchor="middle" font-size="11" fill="#3B6D11">RUN</text>

  <!-- Button pin markers -->
  <rect x="222" y="108" width="10" height="8" rx="1" fill="#EF9F27" stroke="#BA7517" stroke-width="0.8"/>
  <rect x="222" y="150" width="10" height="8" rx="1" fill="#666" stroke="#333" stroke-width="0.8"/>

  <!-- Pin 1/2 labels BELOW button -->
  <text x="227" y="182" font-size="10" fill="#444441">Pata 1</text>
  <text x="227" y="194" font-size="10" fill="#444441">Pata 2</text>
  <text x="227" y="206" font-size="10" fill="#888780">(diagonal)</text>

  <!-- Wire color legend — placed BELOW wires, no overlap -->
  <rect x="20" y="230" width="300" height="50" rx="6" fill="#F8F8F6" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="34" y1="248" x2="70" y2="248" stroke="#EF9F27" stroke-width="3"/>
  <text x="78" y="252" font-size="12" fill="#2C2C2A">Cable naranja → pata 1 del botón</text>
  <line x1="34" y1="268" x2="70" y2="268" stroke="#333" stroke-width="3"/>
  <text x="78" y="272" font-size="12" fill="#2C2C2A">Cable negro → pata diagonal</text>

  <!-- Instruction box -->
  <rect x="20" y="296" width="300" height="110" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="170" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">Cómo soldar</text>
  <text x="36" y="336" font-size="12" fill="#444441">1. Suelda cable naranja a pata 1</text>
  <text x="36" y="354" font-size="12" fill="#444441">2. Suelda cable negro a pata diagonal</text>
  <text x="36" y="372" font-size="12" fill="#444441">3. Pon terminal Dupont hembra</text>
  <text x="46" y="388" font-size="12" fill="#444441">   en el otro extremo del cable</text>

  <!-- Dupont connector note -->
  <rect x="20" y="420" width="300" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="170" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">Conectar a la Pi</text>
  <text x="36" y="456" font-size="12" fill="#0F6E56">Naranja → Pin 11 | Negro → Pin 9</text>

  <!-- ═══════════════════════════════════ -->
  <!-- RIGHT: RED BUTTON (POWER) -->
  <!-- ═══════════════════════════════════ -->

  <text x="510" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#A32D2D">Red button — Power</text>
  <text x="510" y="70" text-anchor="middle" font-size="12" fill="#791F1F">Tactile 12×12mm — en serie</text>

  <!-- LX-2BUPS -->
  <rect x="356" y="90" width="110" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="411" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">LX-2BUPS</text>
  <text x="411" y="134" text-anchor="middle" font-size="11" fill="#854F0B">8.5V output (+)</text>

  <!-- Wire LX → red button — goes ABOVE the boxes -->
  <path d="M466 110 L500 110 L500 100 L540 100 L540 110" fill="none" stroke="#E24B4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cut scissors label — ABOVE the wire -->
  <text x="503" y="92" text-anchor="middle" font-size="18" fill="#A32D2D">✂</text>
  <text x="503" y="82" text-anchor="middle" font-size="10" fill="#A32D2D">CORTA AQUÍ</text>

  <!-- Red button -->
  <rect x="540" y="88" width="86" height="80" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="583" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#791F1F">RED</text>
  <text x="583" y="138" text-anchor="middle" font-size="12" fill="#A32D2D">BUTTON</text>
  <text x="583" y="154" text-anchor="middle" font-size="11" fill="#A32D2D">POWER</text>

  <!-- Wire red button → down → Build HAT -->
  <path d="M583 168 L583 200 L620 200 L620 218" fill="none" stroke="#E24B4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Build HAT -->
  <rect x="575" y="218" width="90" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="620" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">Build HAT</text>
  <text x="620" y="260" text-anchor="middle" font-size="11" fill="#534AB7">barrel jack</text>

  <!-- Wire direction labels — placed away from wires -->
  <text x="480" y="130" font-size="11" fill="#A32D2D">Cable (+)</text>
  <text x="480" y="142" font-size="11" fill="#A32D2D">positivo</text>

  <!-- Instruction box -->
  <rect x="356" y="300" width="300" height="110" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="506" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">Cómo conectar</text>
  <text x="372" y="340" font-size="12" fill="#444441">1. Corta el cable (+) rojo entre</text>
  <text x="382" y="356" font-size="12" fill="#444441">   LX-2BUPS y el barrel jack</text>
  <text x="372" y="374" font-size="12" fill="#444441">2. Suelda cada extremo cortado</text>
  <text x="382" y="390" font-size="12" fill="#444441">   a una pata del botón rojo</text>

  <!-- Warning box -->
  <rect x="356" y="424" width="300" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="506" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">⚠ Importante</text>
  <text x="372" y="464" font-size="12" fill="#854F0B">Usar solo cuando el robot esté quieto.</text>
  <text x="372" y="478" font-size="12" fill="#854F0B">No operar con motores en marcha.</text>

</svg>