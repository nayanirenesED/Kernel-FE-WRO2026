<svg width="680" height="740" viewBox="0 0 680 740" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: Arial, sans-serif;">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C2C2A">KERNEL — wiring diagram (V2)</text>

  <!-- ══════════════════════════════════ -->
  <!-- POWER ROW -->
  <!-- ══════════════════════════════════ -->

  <!-- 18650 -->
  <rect x="40" y="45" width="120" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="100" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">18650 cells</text>
  <text x="100" y="87" text-anchor="middle" font-size="11" fill="#854F0B">2x Li-ion 3.7V</text>

  <!-- LX-2BUPS -->
  <rect x="220" y="45" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="285" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">LX-2BUPS</text>
  <text x="285" y="87" text-anchor="middle" font-size="11" fill="#854F0B">boost to 8.5V</text>

  <!-- Red button — placed to the RIGHT, no conflict -->
  <rect x="420" y="130" width="130" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="485" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#791F1F">Red button (power)</text>

  <!-- Build HAT -->
  <rect x="420" y="45" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="485" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">Build HAT</text>
  <text x="485" y="87" text-anchor="middle" font-size="11" fill="#534AB7">LEGO interface</text>

  <!-- Raspberry Pi -->
  <rect x="420" y="210" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="485" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">Raspberry Pi 4B</text>
  <text x="485" y="252" text-anchor="middle" font-size="11" fill="#0F6E56">main controller</text>

  <!-- 18650 → LX-2BUPS -->
  <line x1="160" y1="73" x2="218" y2="73" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="172" y="65" font-size="10" fill="#854F0B">8.5V</text>

  <!-- LX-2BUPS → Red button (goes right then down) -->
  <path d="M350 73 L400 73 L400 130 L418 152" stroke="#E24B4A" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Red button → Build HAT (goes up) -->
  <line x1="485" y1="130" x2="485" y2="103" stroke="#E24B4A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="120" font-size="10" fill="#A32D2D">barrel 8.5V</text>

  <!-- Build HAT → Pi (GPIO, down) -->
  <line x1="485" y1="101" x2="485" y2="208" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="492" y="160" font-size="10" fill="#0F6E56">5V GPIO</text>

  <!-- ══════════════════════════════════ -->
  <!-- MOTORS — routed LEFT of red button -->
  <!-- ══════════════════════════════════ -->

  <!-- Large motor -->
  <rect x="40" y="220" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="105" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">Large motor</text>
  <text x="105" y="262" text-anchor="middle" font-size="11" fill="#5F5E5A">Port A — traction</text>

  <!-- Medium motor -->
  <rect x="40" y="300" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="105" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">Medium motor</text>
  <text x="105" y="342" text-anchor="middle" font-size="11" fill="#5F5E5A">Port B — steering</text>

  <!-- Motors → Build HAT: route UP then RIGHT, staying left of x=410 -->
  <!-- Large motor -->
  <path d="M170 248 L190 248 L190 38 L418 38 L418 60" stroke="#888780" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <!-- Medium motor -->
  <path d="M170 328 L195 328 L195 33 L418 33 L418 65" stroke="#888780" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <text x="172" y="240" font-size="10" fill="#5F5E5A">LEGO cables</text>

  <!-- ══════════════════════════════════ -->
  <!-- CAMERA -->
  <!-- ══════════════════════════════════ -->

  <rect x="40" y="470" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="105" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">IMX708 camera</text>
  <text x="105" y="512" text-anchor="middle" font-size="11" fill="#0F6E56">12MP — CSI</text>

  <!-- Camera → Pi (CSI) — route right then up -->
  <path d="M170 498 L400 498 L400 238 L418 238" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="240" y="490" font-size="10" fill="#0F6E56">CSI ribbon</text>

  <!-- ══════════════════════════════════ -->
  <!-- I2C SENSORS -->
  <!-- ══════════════════════════════════ -->

  <!-- TCA9548A -->
  <rect x="220" y="470" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="285" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">TCA9548A</text>
  <text x="285" y="512" text-anchor="middle" font-size="11" fill="#185FA5">I2C multiplexer</text>

  <!-- Mux → Pi -->
  <path d="M350 498 L405 498 L405 268 L418 268" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="358" y="276" font-size="10" fill="#185FA5">I2C</text>

  <!-- ToF sensors -->
  <rect x="40" y="558" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="90" y="583" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">ToF front</text>
  <text x="90" y="600" text-anchor="middle" font-size="10" fill="#185FA5">VL53L0X</text>

  <rect x="155" y="558" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="205" y="583" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">ToF left</text>
  <text x="205" y="600" text-anchor="middle" font-size="10" fill="#185FA5">VL53L0X</text>

  <rect x="270" y="558" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="320" y="583" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">ToF right</text>
  <text x="320" y="600" text-anchor="middle" font-size="10" fill="#185FA5">VL53L0X</text>

  <!-- IMU -->
  <rect x="385" y="558" width="100" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="435" y="583" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">BNO08X</text>
  <text x="435" y="600" text-anchor="middle" font-size="10" fill="#185FA5">IMU</text>

  <!-- Sensors → Mux -->
  <line x1="90" y1="558" x2="255" y2="526" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="205" y1="558" x2="265" y2="526" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="320" y1="558" x2="295" y2="526" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="435" y1="558" x2="320" y2="526" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Green button -->
  <rect x="500" y="380" width="140" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="570" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#27500A">Green button (run)</text>

  <!-- Green button → Pi GPIO 17 -->
  <path d="M570 380 L570 280 L552 280 L552 268 L550 268" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="558" y="325" font-size="10" fill="#3B6D11">GPIO 17</text>

  <!-- LEGEND -->
  <rect x="40" y="645" width="600" height="66" rx="8" fill="#F8F8F6" stroke="#D3D1C7" stroke-width="0.8"/>
  <text x="58" y="663" font-size="12" font-weight="bold" fill="#2C2C2A">Legend</text>
  <line x1="110" y1="663" x2="140" y2="663" stroke="#BA7517" stroke-width="2"/>
  <text x="145" y="667" font-size="11" fill="#444441">Power 8.5V</text>
  <line x1="220" y1="663" x2="250" y2="663" stroke="#E24B4A" stroke-width="2"/>
  <text x="255" y="667" font-size="11" fill="#444441">Switched power</text>
  <line x1="365" y1="663" x2="395" y2="663" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="400" y="667" font-size="11" fill="#444441">GPIO / 5V</text>
  <line x1="110" y1="690" x2="140" y2="690" stroke="#185FA5" stroke-width="1.5"/>
  <text x="145" y="694" font-size="11" fill="#444441">I2C / CSI data</text>
  <line x1="220" y1="690" x2="250" y2="690" stroke="#888780" stroke-width="1.5"/>
  <text x="255" y="694" font-size="11" fill="#444441">LEGO cable</text>
  <line x1="365" y1="690" x2="395" y2="690" stroke="#3B6D11" stroke-width="1.5"/>
  <text x="400" y="694" font-size="11" fill="#444441">GPIO signal</text>

  <text x="340" y="728" text-anchor="middle" font-size="10" fill="#888780">Team KERNEL — WRO Future Engineers 2026</text>
</svg>